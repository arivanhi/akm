{% extends 'base.html' %} 
{% block title %}Input Data Pasien{% endblock %} 

{% block content %}
<div class="page-header">
    <h1 class="page-title">Pendaftaran Pasien Baru</h1>
</div>

<div class="form-container">
    <form method="POST" action="{{ url_for('input_pasien') }}">
        <input type="hidden" name="source" value="{{ source }}">
        
        <div class="form-row">
            <div class="form-group">
                <label>Nama Lengkap <span style="color:red">*</span></label>
                <input type="text" name="nama_pasien" class="form-control" required placeholder="Nama Lengkap Pasien">
            </div>
            <div class="form-group">
                <label>NIK (16 Digit) <span style="color:red">*</span></label>
                <input type="number" name="nik" class="form-control" required placeholder="Nomor Induk Kependudukan">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Tanggal Lahir <span style="color:red">*</span></label>
                <input type="date" name="tanggal_lahir" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Jenis Kelamin <span style="color:red">*</span></label>
                <select name="jenis_kelamin" class="form-control" required>
                    <option value="Laki-laki">Laki-laki</option>
                    <option value="Perempuan">Perempuan</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>No. HP / WhatsApp <span style="color:red">*</span></label>
                <input type="number" name="no_hp" class="form-control" required placeholder="08xxxxxxxxxx">
            </div>
            <div class="form-group">
                <label>Email (Opsional)</label>
                <input type="email" name="email" class="form-control" placeholder="alamat@email.com">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group" style="overflow: visible;">
                <label>Provinsi <span style="color:red">*</span></label>
                <div class="ac-wrapper">
                    <input type="text" id="inputProvinsi" name="provinsi" class="form-control ac-input" required placeholder="Ketik Provinsi (cth: Jawa Tengah)..." autocomplete="off">
                    <div id="listProvinsi" class="ac-list-container"></div>
                </div>
            </div>

            <div class="form-group" style="overflow: visible;">
                <label>Kecamatan <span style="color:red">*</span></label>
                <div class="ac-wrapper">
                    <input type="text" id="inputKecamatan" name="kecamatan" class="form-control ac-input" required placeholder="Ketik Kecamatan (cth: Tembalang)..." autocomplete="off">
                    <div id="listKecamatan" class="ac-list-container"></div>
                </div>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group" style="overflow: visible;">
                <label>Kelurahan <span style="color:red">*</span></label>
                <div class="ac-wrapper">
                    <input type="text" id="inputKelurahan" name="kelurahan" class="form-control ac-input" required placeholder="Ketik Kelurahan (cth: Bulusan)..." autocomplete="off">
                    <div id="listKelurahan" class="ac-list-container"></div>
                </div>
            </div>
            
            <div class="form-group">
                <label>Alamat Detail (Jalan, RT/RW) <span style="color:red">*</span></label>
                <input type="text" name="alamat" class="form-control" required placeholder="Jl. Nama Jalan, No. Rumah, RT/RW">
            </div>
        </div>

        <button type="submit" class="btn-submit" style="width: 100%; margin-top: 20px;">
            <i class="fas fa-save"></i> Simpan Data Pasien
        </button>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
$(document).ready(function() {
    
    /**
     * Fungsi Autocomplete Wilayah Pintar
     * @param {string} inputId      ID Input (misal #inputKelurahan)
     * @param {string} listId       ID List Container (misal #listKelurahan)
     * @param {string} category     Kategori ('kelurahan', 'kecamatan', 'provinsi')
     * @param {string} filterInputId (Opsional) ID Input Induk untuk filter (misal #inputKecamatan)
     */
    function setupAutocomplete(inputId, listId, category, filterInputId = null) {
        const $input = $(inputId);
        const $list = $(listId);
        let timeout = null;

        $input.on('input', function() {
            const val = this.value;
            
            if (!val) {
                $list.hide().empty();
                return;
            }
            
            $input.addClass('ac-loading');

            clearTimeout(timeout);
            timeout = setTimeout(function() {
                
                // 1. Siapkan Parameter Request
                let params = { category: category, q: val };
                
                // 2. Cek apakah ada Filter Induk (Khusus Kelurahan)
                if (filterInputId) {
                    const parentVal = $(filterInputId).val();
                    if (parentVal) {
                        // Kirim nama kecamatan ke backend untuk memfilter hasil
                        params.parent_name = parentVal;
                        console.log(`Filter Kelurahan berdasarkan Kecamatan: ${parentVal}`);
                    }
                }

                // 3. Panggil API
                $.getJSON('/api/search_wilayah', params)
                .done(function(data) {
                    $list.empty();
                    
                    if (data.length > 0) {
                        data.forEach(item => {
                            // Highlight teks
                            let regex = new RegExp(`(${val})`, "gi");
                            let displayName = item.nama.replace(regex, "<strong>$1</strong>");
                            
                            // Info tambahan (misal nama Kecamatannya)
                            let subText = "";
                            if (category === 'kelurahan' && item.kecamatan) {
                                subText = `<br><small style="color:#666; font-size:0.8em;">Kec. ${item.kecamatan}</small>`;
                            }

                            const $itemDiv = $("<div>").addClass("ac-item").html(displayName + subText);
                            
                            $itemDiv.on("click", function() {
                                $input.val(item.nama); // Isi input
                                
                                // LOGIKA AUTO-FILL (Opsional: Jika user pilih Kelurahan, Kecamatan otomatis terisi juga)
                                if (category === 'kelurahan' && item.kecamatan && filterInputId) {
                                    // Hanya isi kecamatan jika kecamatan masih kosong
                                    if ($(filterInputId).val() === "") {
                                        $(filterInputId).val(item.kecamatan).css('background-color', '#fff3cd')
                                            .animate({ backgroundColor: "#ffffff" }, 1000);
                                    }
                                }
                                
                                $list.hide().empty();
                            });
                            
                            $list.append($itemDiv);
                        });
                        $list.show(); 
                    } else {
                        // Pesan jika tidak ditemukan
                        let msg = "Data tidak ditemukan";
                        if (filterInputId && $(filterInputId).val()) {
                            msg = `Tidak ada di Kec. ${$(filterInputId).val()}`;
                        }
                        $list.html(`<div class="ac-item" style="color:#dc3545; cursor:default; font-style:italic;">${msg}</div>`).show();
                    }
                })
                .fail(function() { console.error("API Error"); })
                .always(function() { $input.removeClass('ac-loading'); });

            }, 300); 
        });

        // Tutup list saat klik di luar
        $(document).on("click", function(e) {
            if (!$input.is(e.target) && !$list.is(e.target) && $list.has(e.target).length === 0) {
                $list.hide();
            }
        });
    }

    // --- INISIALISASI ---
    
    // 1. Provinsi
    setupAutocomplete('#inputProvinsi', '#listProvinsi', 'provinsi');
    
    // 2. Kecamatan
    setupAutocomplete('#inputKecamatan', '#listKecamatan', 'kecamatan');
    
    // 3. Kelurahan (DENGAN FILTER KECAMATAN)
    // Parameter ke-4 adalah ID input kecamatan (#inputKecamatan)
    setupAutocomplete('#inputKelurahan', '#listKelurahan', 'kelurahan', '#inputKecamatan');

    // --- UX TAMBAHAN: BERSIHKAN KELURAHAN JIKA KECAMATAN DIGANTI ---
    // Agar data tetap konsisten, jika user mengganti nama kecamatan, 
    // hapus isi kelurahan agar user memilih ulang.
    $('#inputKecamatan').on('change', function() {
        $('#inputKelurahan').val('');
    });

});
</script>
{% endblock %}
